[package]
name = "sosu-seisei-main2"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
rayon = "1.10"
bitvec = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
env_logger = "0.11"
log = "0.4"
egui = "0.29"
eframe = "0.29"
sysinfo = "0.32"
rfd = "0.15"
primecount = "0.2"
chrono = "0.4"
fastrand = "2"
statrs = "0.17"

# Windows/MSVC では Rust が常に release CRT (/MD) を使う一方、
# primecount の CMake ビルドが Debug (/MDd) になるとリンク不整合が起きやすい。
# dev でも primecount だけ最適化を少し入れて RelWithDebInfo 相当でビルドさせる。
[profile.dev.package.primecount]
opt-level = 1
